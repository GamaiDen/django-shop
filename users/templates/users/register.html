{% extends 'catalog/base.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5"><h1>Регистрация</h1>
<form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger small">{{ field.errors|striptags }}</div>{% endif %}</div>{% endfor %}
<button type="submit" class="btn btn-primary">Зарегистрироваться</button></form>
<p class="mt-2">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p></div></div>
{% endblock %}
