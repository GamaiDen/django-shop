{% extends 'catalog/base.html' %}
{% block title %}{{ post.title }}{% endblock %}
{% block content %}
<h1>{{ post.title }}</h1>
<p class="text-muted">{{ post.created_at|date:"d.m.Y" }} | 👁 {{ post.views_count }}</p>
<p>{{ post.content|linebreaks }}</p>
<a href="{% url 'blog_list' %}" class="btn btn-outline-secondary">← Назад</a>
<a href="{% url 'blog_update' post.pk %}" class="btn btn-warning">Редактировать</a>
<a href="{% url 'blog_delete' post.pk %}" class="btn btn-danger">Удалить</a>
{% endblock %}
